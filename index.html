<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Movies</title>
    <script src="pouchdb.min.js"></script>
    <script src="script.js"></script>
</head>
<body>

<h3>Add Movie</h3>
    Title: <input id="title"><br>
    Actor: <input id="actors"><br>
    Genre: <input id="genres"><br>
<button onclick="addMovie()">Add</button>

<hr>

<h3>Find Movie</h3>
ID: <input id="findId">
<button onclick="getMovie()">Find</button>

<pre id="result"></pre>

<hr>

<h3>Update Movie</h3>
ID: <input id="updateId"><br>
Actors: <input id="updateActors"><br>
Genres: <input id="updateGenres"><br>
<button onclick="updateMovie()">Update</button>

<hr>

<h3>Delete Movie</h3>
ID: <input id="deleteId">
<button onclick="deleteMovie()">Delete</button>
</body>
</html>
